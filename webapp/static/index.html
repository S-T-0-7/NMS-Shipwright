<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NMS Seed Tool</title>
<style>
  :root {
    --bg: #0b0e17;
    --panel: #121729;
    --panel-2: #171d33;
    --border: #263055;
    --text: #dbe2f5;
    --text-dim: #8891b3;
    --accent: #35d0c0;
    --accent-2: #a78bfa;
    --warn: #f5a623;
    --danger: #f2495c;
    --good: #35d0c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #131a30 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    letter-spacing: 0.08em;
    margin: 0;
    color: var(--accent);
    text-transform: uppercase;
  }
  header .sub { color: var(--text-dim); font-size: 12px; }
  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    align-items: start;
  }
  main { padding: 20px 24px; }
  aside {
    padding: 20px;
    border-left: 1px solid var(--border);
    min-height: calc(100vh - 60px);
    background: rgba(255,255,255,0.01);
  }
  h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(53,208,192,0.08); }
  .results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }
  .card {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img { width: 100%; height: 110px; object-fit: cover; background: #000; display: block; }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card .type { color: var(--accent-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .card .seed { font-family: Consolas, monospace; font-size: 12px; color: var(--text); word-break: break-all; }
  .card .colours { font-size: 11px; color: var(--text-dim); }
  .card .desc { font-size: 11px; color: var(--text-dim); font-style: italic; }
  .card .modtag { font-size: 10px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 2px 6px; display: inline-block; width: fit-content; }
  .card .row { display: flex; gap: 6px; margin-top: 4px; }
  select, button, input {
    font-family: inherit;
    font-size: 12px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #06141a; border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.4; cursor: default; }
  .save-picker { width: 100%; margin-bottom: 14px; }
  .ship-slot {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    background: var(--panel);
  }
  .ship-slot .top { display: flex; justify-content: space-between; align-items: center; }
  .ship-slot .name { font-size: 13px; font-weight: 600; }
  .ship-slot .cat { font-size: 11px; color: var(--accent-2); }
  .ship-slot .seed { font-family: Consolas, monospace; font-size: 11px; color: var(--text-dim); margin: 4px 0; word-break: break-all; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .badge.proc { background: rgba(53,208,192,0.15); color: var(--good); }
  .badge.fixed { background: rgba(242,73,92,0.15); color: var(--danger); }
  .ship-slot .actions { display: flex; gap: 6px; margin-top: 6px; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; max-width: 360px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; font-size: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.ok { border-color: var(--good); }
  .toast.err { border-color: var(--danger); }
  .toast.warn { border-color: var(--warn); }
  .addform { margin-top: 26px; border-top: 1px solid var(--border); padding-top: 16px; }
  .addform .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .addform input { width: 100%; }
  .muted { color: var(--text-dim); font-size: 11px; }
  #applyTarget { width: 100%; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>NMS Seed Tool</h1>
  <span class="sub">real seeds &middot; local save editor &middot; runs only on this machine</span>
</header>

<div class="layout">
  <main>
    <h2>Catalog</h2>
    <div id="typeFilters" class="filters"></div>
    <div id="colourFilters" class="filters"></div>
    <div id="resultCount" class="muted"></div>
    <div id="results" class="results"></div>

    <div class="addform">
      <h2>Log a seed you found</h2>
      <div class="grid">
        <input id="addSeed" placeholder="0x...">
        <input id="addType" placeholder="Type (Fighter, Hauler, ...)">
        <input id="addColours" placeholder="Colours (comma separated)">
        <input id="addDescription" placeholder="Description (optional)">
      </div>
      <div style="margin-top:8px;">
        <button class="primary" onclick="addSeed()">Add to catalog</button>
      </div>
    </div>
  </main>

  <aside>
    <h2>Your save</h2>
    <select id="savePicker" class="save-picker"></select>
    <div id="shipSlots"></div>
  </aside>
</div>

<script>
let state = {
  types: [], colours: [], activeType: null, activeColours: new Set(),
  saves: [], currentSavePath: null, ships: [],
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json();
  if (!res.ok || body.ok === false) throw new Error(body.error || res.statusText);
  return body;
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

// ---------------- catalog ----------------

async function loadFacets() {
  const f = await api('/api/catalog/facets');
  state.types = f.types; // [[type, count], ...]
  state.colours = f.colours;
  renderTypeFilters();
  renderColourFilters();
}

function renderTypeFilters() {
  const el = document.getElementById('typeFilters');
  el.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'chip' + (state.activeType === null ? ' active' : '');
  all.textContent = 'All types';
  all.onclick = () => { state.activeType = null; renderTypeFilters(); loadResults(); };
  el.appendChild(all);
  for (const [t, count] of state.types) {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.activeType === t ? ' active' : '');
    chip.textContent = `${t} (${count})`;
    chip.onclick = () => { state.activeType = t; renderTypeFilters(); loadResults(); };
    el.appendChild(chip);
  }
}

function renderColourFilters() {
  const el = document.getElementById('colourFilters');
  el.innerHTML = '';
  for (const c of state.colours) {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.activeColours.has(c) ? ' active' : '');
    chip.textContent = c;
    chip.onclick = () => {
      if (state.activeColours.has(c)) state.activeColours.delete(c);
      else state.activeColours.add(c);
      renderColourFilters();
      loadResults();
    };
    el.appendChild(chip);
  }
}

async function loadResults() {
  const params = new URLSearchParams();
  if (state.activeType) params.set('type', state.activeType);
  // API supports one colour substring; use the first active one client-side,
  // and further filter client-side for any additional selected colours.
  const activeColours = [...state.activeColours];
  if (activeColours.length) params.set('colour', activeColours[0]);

  let rows = await api('/api/catalog?' + params.toString());
  if (activeColours.length > 1) {
    rows = rows.filter(r => activeColours.every(c => (r.colours || '').includes(c)));
  }

  document.getElementById('resultCount').textContent = `${rows.length} ship(s)`;
  const el = document.getElementById('results');
  el.innerHTML = '';
  for (const r of rows) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${r.image_url ? `<img src="${r.image_url}" loading="lazy">` : ''}
      <div class="body">
        <div class="type">${r.type || 'Unknown'}</div>
        <div class="seed">${r.seed}</div>
        ${r.colours ? `<div class="colours">${r.colours}</div>` : ''}
        ${r.description ? `<div class="desc">"${r.description}"</div>` : ''}
        ${r.requires_mod ? `<div class="modtag">requires mod: ${r.requires_mod}</div>` : ''}
        <div class="row">
          <select data-seed="${r.seed}" class="applyTarget"></select>
          <button onclick="applyFromCard(this)">Apply</button>
        </div>
      </div>`;
    el.appendChild(card);
    populateSlotSelect(card.querySelector('.applyTarget'), r.requires_mod);
  }
}

function populateSlotSelect(selectEl, requiresMod) {
  selectEl.innerHTML = '';
  // A gShip-style catalog entry only does anything on the Golden Vector
  // slot; a normal procedural entry only does anything on a procedural
  // slot. Offer whichever applies.
  const eligible = state.ships.filter(s => requiresMod ? s.is_golden_vector : s.is_procedural);
  if (!eligible.length) {
    const opt = document.createElement('option');
    opt.textContent = requiresMod ? 'no Golden Vector slot in this save' : 'no procedural slot';
    opt.disabled = true;
    selectEl.appendChild(opt);
    return;
  }
  for (const s of eligible) {
    const opt = document.createElement('option');
    opt.value = s.index;
    opt.textContent = `[${s.index}] ${s.category_guess}`;
    selectEl.appendChild(opt);
  }
}

async function applyFromCard(btn) {
  const card = btn.closest('.card');
  const select = card.querySelector('.applyTarget');
  const seed = select.dataset.seed;
  const slot = select.value;
  if (slot === '' || slot === undefined) { toast('No procedural slot available', 'err'); return; }
  await applySeed(parseInt(slot), seed);
}

// ---------------- saves / ships ----------------

async function loadSaves() {
  state.saves = await api('/api/saves');
  const picker = document.getElementById('savePicker');
  picker.innerHTML = '';
  for (const s of state.saves) {
    const opt = document.createElement('option');
    opt.value = s.path;
    opt.textContent = `${s.slot_name} (${s.profile})`;
    picker.appendChild(opt);
  }
  picker.onchange = () => { state.currentSavePath = picker.value; loadShips(); };
  if (state.saves.length) {
    state.currentSavePath = state.saves[0].path; // most recently modified, per API ordering
    picker.value = state.currentSavePath;
    await loadShips();
  } else {
    document.getElementById('shipSlots').innerHTML = '<p class="muted">No save files found.</p>';
  }
}

async function loadShips() {
  if (!state.currentSavePath) return;
  state.ships = await api('/api/saves/ships?path=' + encodeURIComponent(state.currentSavePath));
  renderShips();
  loadResults(); // refresh the per-card slot dropdowns
}

function renderShips() {
  const el = document.getElementById('shipSlots');
  el.innerHTML = '';
  for (const s of state.ships) {
    const div = document.createElement('div');
    div.className = 'ship-slot';
    const badgeLabel = s.is_procedural ? 'procedural' : (s.is_golden_vector ? 'golden vector' : 'fixed');
    div.innerHTML = `
      <div class="top">
        <span class="name">[${s.index}] ${s.name || '(unnamed)'}</span>
        <span class="badge ${s.is_procedural ? 'proc' : 'fixed'}">${badgeLabel}</span>
      </div>
      <div class="cat">${s.category_guess}</div>
      <div class="seed">${s.seed}</div>
      ${s.is_golden_vector ? '<div class="muted">needs gShip mod for seeds to matter — see catalog "Golden Vector Mod" cards</div>' : ''}
      <div class="actions">
        <button ${s.is_procedural ? '' : 'disabled'} onclick="reroll(${s.index})">Reroll</button>
        <button onclick="undo()">Undo last</button>
      </div>`;
    el.appendChild(div);
  }
}

async function applySeed(slot, seed) {
  try {
    const r = await api('/api/saves/apply', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: state.currentSavePath, slot, seed})
    });
    toast(`Slot ${slot} -> ${r.seed}${r.warning_message ? '\n' + r.warning_message : ''}\nBackup: ${r.backup_path}`,
          r.fixed_model_warning ? 'warn' : 'ok');
    await loadShips();
  } catch (e) { toast(e.message, 'err'); }
}

async function reroll(slot) {
  try {
    const r = await api('/api/saves/reroll', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: state.currentSavePath, slot})
    });
    toast(`Slot ${slot} rerolled -> ${r.seed}\nQuit & reload NMS to see it.\nBackup: ${r.backup_path}`, 'ok');
    await loadShips();
  } catch (e) { toast(e.message, 'err'); }
}

async function undo() {
  try {
    const r = await api('/api/saves/undo', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: state.currentSavePath})
    });
    toast(`Restored from ${r.restored_from}`, 'ok');
    await loadShips();
  } catch (e) { toast(e.message, 'err'); }
}

async function addSeed() {
  const seed = document.getElementById('addSeed').value.trim();
  const type = document.getElementById('addType').value.trim();
  const colours = document.getElementById('addColours').value.trim();
  const description = document.getElementById('addDescription').value.trim();
  try {
    await api('/api/catalog/add', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({seed, type, colours, description, source: 'manual'})
    });
    toast('Added to catalog', 'ok');
    document.getElementById('addSeed').value = '';
    document.getElementById('addType').value = '';
    document.getElementById('addColours').value = '';
    document.getElementById('addDescription').value = '';
    await loadFacets();
    await loadResults();
  } catch (e) { toast(e.message, 'err'); }
}

(async function init() {
  await loadFacets();
  await loadSaves();
  await loadResults();
})();
</script>
</body>
</html>
